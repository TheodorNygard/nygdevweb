name: Deploy nygdev.dev

# DO NOT RENAME THIS FILE. This app's deployment authorization policy is
# "GitHub", so the content server identifies the Static Web App by the workflow
# filename in the OIDC token — the generated name Azure registered at
# provisioning. A rename fails with "Could not determine the Static Web App from
# the GitHub OIDC workflow reference". The `name:` above is free to change.
#
# Manual-only: deploy on demand from the Actions tab. To restore auto-deploy,
# re-add the push/pull_request triggers and close_pull_request_job (git history).
on:
  workflow_dispatch:

# OIDC (federated) auth to Azure — no long-lived secrets stored in GitHub.
# azure/login with a federated credential, then the Az CLI for anything that
# needs auth.
permissions:
  id-token: write
  contents: read

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Az CLI login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve target Static Web App
        env:
          SWA_NAME: ${{ vars.AZURE_SWA_NAME }}
          SWA_RG: ${{ vars.AZURE_SWA_RESOURCE_GROUP }}
        run: |
          # An unset repository variable expands to an empty string, which the Az
          # CLI reports as a bare "expected one argument" usage error. Fail here
          # instead, naming the variable that needs setting.
          if [ -z "$SWA_NAME" ] || [ -z "$SWA_RG" ]; then
            echo "::error::AZURE_SWA_NAME and AZURE_SWA_RESOURCE_GROUP must both be set (Settings -> Secrets and variables -> Actions -> Variables)."
            exit 1
          fi

          echo "Deploying to Static Web App '$SWA_NAME' in resource group '$SWA_RG'"
          echo "SWA_NAME=$SWA_NAME" >> "$GITHUB_ENV"
          echo "SWA_RG=$SWA_RG" >> "$GITHUB_ENV"

      - name: Retrieve Static Web Apps deployment token
        run: |
          # Fetched just-in-time over the federated identity rather than kept as
          # a long-lived GitHub secret. The deploy identity needs a role granting
          # Microsoft.Web/staticSites/listSecrets (e.g. Contributor).
          TOKEN=$(az staticwebapp secrets list \
            --name "$SWA_NAME" \
            --resource-group "$SWA_RG" \
            --query "properties.apiKey" \
            --output tsv)
          echo "::add-mask::$TOKEN"
          echo "SWA_DEPLOYMENT_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Mint GitHub OIDC id token
        id: idtoken
        # The app's deployment authorization policy is "GitHub", so the content
        # server wants this workflow's OIDC token (the deployment token alone is
        # rejected). Handed to the deploy step below as github_id_token.
        uses: actions/github-script@v9
        with:
          script: return await core.getIDToken()
          result-encoding: string

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
          action: "upload"
          # SWA serves app_location as the site root, so nygdev.dev's public
          # paths are unchanged by the per-site folder split.
          app_location: "sites/nygdev"
          api_location: ""
          output_location: "."
          skip_app_build: true
