name: Deploy run.nygard.dev

# Manual-only, matching the nygdev.dev workflow: deploy on demand from the
# Actions tab ("Run workflow"). Auto-deploy on push/PR is intentionally off.
on:
  workflow_dispatch:

# OIDC (federated) auth to Azure — no long-lived secrets stored in GitHub.
# id-token: write is for azure/login only; unlike the nygdev.dev workflow this
# one hands no OIDC token to the deploy action (see Build And Deploy).
permissions:
  id-token: write
  contents: read

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Az CLI login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve target Static Web App
        env:
          SWA_NAME: ${{ vars.AZURE_SWA_NAME_RUN }}
          SWA_RG: ${{ vars.AZURE_SWA_RESOURCE_GROUP_RUN }}
          SWA_RG_SHARED: ${{ vars.AZURE_SWA_RESOURCE_GROUP }}
        run: |
          # An unset repository variable expands to an empty string, which the Az
          # CLI reports as a bare "expected one argument" usage error. Fail here
          # instead, naming the variable that needs setting.
          if [ -z "$SWA_NAME" ]; then
            echo "::error::Repository variable AZURE_SWA_NAME_RUN is not set (Settings -> Secrets and variables -> Actions -> Variables). It must hold the Azure resource name of the run.nygard.dev Static Web App."
            exit 1
          fi

          # Usually shared with the nygdev.dev app, so fall back to
          # AZURE_SWA_RESOURCE_GROUP when no _RUN override is set.
          if [ -z "$SWA_RG" ]; then
            SWA_RG="$SWA_RG_SHARED"
          fi
          if [ -z "$SWA_RG" ]; then
            echo "::error::Neither AZURE_SWA_RESOURCE_GROUP_RUN nor AZURE_SWA_RESOURCE_GROUP is set."
            exit 1
          fi

          echo "Deploying to Static Web App '$SWA_NAME' in resource group '$SWA_RG'"
          echo "SWA_NAME=$SWA_NAME" >> "$GITHUB_ENV"
          echo "SWA_RG=$SWA_RG" >> "$GITHUB_ENV"

      - name: Retrieve Static Web Apps deployment token
        run: |
          # Fetched just-in-time over the federated identity rather than kept as
          # a long-lived GitHub secret. The deploy identity needs a role granting
          # Microsoft.Web/staticSites/listSecrets (e.g. Contributor).
          TOKEN=$(az staticwebapp secrets list \
            --name "$SWA_NAME" \
            --resource-group "$SWA_RG" \
            --query "properties.apiKey" \
            --output tsv)
          echo "::add-mask::$TOKEN"
          echo "SWA_DEPLOYMENT_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # No github_id_token, unlike the nygdev.dev workflow: passing one puts the
      # content server on the OIDC path, where it resolves the target app from a
      # workflow filename registered at provisioning time. This app was created
      # without GitHub integration, so that lookup can only fail. The deployment
      # token authorizes instead, which also leaves the filename free to describe
      # what it deploys. Needs the app's authorization policy set to "Deployment
      # token" (portal: Static Web App -> Settings -> Deployment configuration).
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "sites/run"
          api_location: ""
          output_location: "."
          skip_app_build: true
