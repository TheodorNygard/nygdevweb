name: Deploy run.nygard.dev

# Manual-only, matching the nygdev.dev workflow: deploy on demand from the
# Actions tab ("Run workflow"). Auto-deploy on push/PR is intentionally off.
on:
  workflow_dispatch:

# OIDC (federated) auth to Azure — no long-lived secrets stored in GitHub.
# Reuses the federated credential already scoped to this repo; only the target
# Static Web App differs from the nygdev.dev deploy.
permissions:
  id-token: write
  contents: read

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Az CLI login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve target Static Web App
        env:
          SWA_NAME: ${{ vars.AZURE_SWA_NAME_RUN }}
          SWA_RG: ${{ vars.AZURE_SWA_RESOURCE_GROUP_RUN }}
          SWA_RG_SHARED: ${{ vars.AZURE_SWA_RESOURCE_GROUP }}
        run: |
          # An unset repository variable expands to an empty string, which the
          # Az CLI reports as a bare "expected one argument" usage error. Fail
          # here instead, naming the variable that needs setting.
          if [ -z "$SWA_NAME" ]; then
            echo "::error::Repository variable AZURE_SWA_NAME_RUN is not set (Settings -> Secrets and variables -> Actions -> Variables). It must hold the Azure resource name of the run.nygard.dev Static Web App."
            exit 1
          fi

          # The resource group is usually shared with the nygdev.dev app, so
          # fall back to AZURE_SWA_RESOURCE_GROUP when no _RUN override is set.
          if [ -z "$SWA_RG" ]; then
            SWA_RG="$SWA_RG_SHARED"
          fi
          if [ -z "$SWA_RG" ]; then
            echo "::error::Neither AZURE_SWA_RESOURCE_GROUP_RUN nor AZURE_SWA_RESOURCE_GROUP is set."
            exit 1
          fi

          echo "Deploying to Static Web App '$SWA_NAME' in resource group '$SWA_RG'"
          echo "SWA_NAME=$SWA_NAME" >> "$GITHUB_ENV"
          echo "SWA_RG=$SWA_RG" >> "$GITHUB_ENV"

      - name: Retrieve Static Web Apps deployment token
        run: |
          # Fetch the deployment token just-in-time over the federated identity
          # instead of storing it as a long-lived GitHub secret. The deploy
          # identity needs a role on the Static Web App that grants
          # Microsoft.Web/staticSites/listSecrets (e.g. Contributor).
          TOKEN=$(az staticwebapp secrets list \
            --name "$SWA_NAME" \
            --resource-group "$SWA_RG" \
            --query "properties.apiKey" \
            --output tsv)
          echo "::add-mask::$TOKEN"
          echo "SWA_DEPLOYMENT_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Mint GitHub OIDC id token
        id: idtoken
        # The Static Web App's deployment authorization policy is "GitHub", so the
        # content server authorizes deploys using this workflow's GitHub OIDC token
        # (the deployment token alone is rejected). Mint it here and hand it to the
        # deploy action below as github_id_token. Requires permissions.id-token: write.
        uses: actions/github-script@v9
        with:
          script: return await core.getIDToken()
          result-encoding: string

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
          action: "upload"
          app_location: "sites/run"
          api_location: ""
          output_location: "."
          skip_app_build: true
