<!DOCTYPE html>
<html lang="en">
<head>
    <!--Security Headers-->
    <!--<meta http-equiv="X-Frame-Options" content="SAMEORIGIN">-->
    <meta http-equiv="Content-Security-Policy" content="default-src https: data: 'unsafe-inline' 'unsafe-eval'">
    <meta http-equiv="Permissions-Policy" content="geolocation=()">
    
    <title>NygDev</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#9f00a7">
    <meta name="theme-color" content="#d5d5d5">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --text: #2b2d42;
            --light-text: #555;
            --background: #f8f9fa;
            --card-bg: #ffffff;
            --success: #38b000;
            --border-radius: 12px;
            --transition: all 0.3s ease;
            --shadow: 0 8px 30px rgba(0,0,0,0.05);
            --shadow-hover: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        [data-theme="dark"] {
            --primary: #4cc9f0;
            --primary-dark: #4361ee;
            --secondary: #f72585;
            --text: #f8f9fa;
            --light-text: #d9d9d9;
            --background: #121212;
            --card-bg: #1e1e1e;
            --success: #52b788;
            --shadow: 0 8px 30px rgba(0,0,0,0.2);
            --shadow-hover: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--background);
            font-family: 'Poppins', sans-serif;
            color: var(--text);
            transition: var(--transition);
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        
        .logo-container {
            margin-bottom: 20px;
        }
        
        h1 {
            color: var(--text);
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }
        
        .tag-line {
            font-weight: 300;
            color: var(--light-text);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .underline {
            display: block;
            height: 4px;
            width: 80px;
            margin: 10px auto 25px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
        }
        
        p {
            color: var(--light-text);
            font-size: 1rem;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        
        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 500;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            border: none;
            width: 100%;
        }
        
        .button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        .button i {
            font-size: 1.1rem;
        }
        
        .theme-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .theme-switch:hover {
            transform: rotate(30deg);
        }
        
        .status {
            margin-top: 20px;
            font-size: 0.9rem;
            height: 20px;
            transition: var(--transition);
        }
        
        .success {
            color: var(--success);
        }
        
        .error {
            color: #e63946;
        }
        
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--light-text);
        }
        
        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            display: none;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .button.loading .spinner {
            display: inline-block;
        }
        
        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .container {
            animation: fadeIn 0.5s ease-out;
        }
        
        /* Status indicator styles */
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-online {
            background-color: var(--success);
            box-shadow: 0 0 5px var(--success);
        }
        
        .status-offline {
            background-color: #e63946;
            box-shadow: 0 0 5px #e63946;
        }
        
        .status-checking {
            background-color: #ffb703;
            box-shadow: 0 0 5px #ffb703;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <button class="theme-switch" id="themeToggle" aria-label="Toggle dark mode">
        <i class="fas fa-moon"></i>
    </button>
    
    <div class="container">
        <div class="logo-container">
            <h1>NygDev</h1>
            <div class="underline"></div>
        </div>
        
        <div class="links">
            <a href="https://www.linkedin.com/in/theodor-nyg%C3%A5rd-17218a79/" class="button" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-linkedin"></i>
                LinkedIn
            </a>
            
            <!-- Replace the two Foundry buttons with a single dynamic button -->
            <button class="button" id="foundryButton">
                <div class="spinner"></div>
                <span class="status-indicator"></span>
                <i class="fas fa-dice-d20"></i>
                <span id="buttonText">Checking Foundry Status...</span>
            </button>
        </div>
        
        <div id="status" class="status"></div>
        
        <div class="footer">
            <span id="year"></span> Theodor
        </div>
    </div>
    
    <script>
        // Set current year
        document.getElementById('year').textContent = new Date().getFullYear();
        
        // Theme switcher
        const themeToggle = document.getElementById('themeToggle');
        const icon = themeToggle.querySelector('i');
        
        // Check for saved theme preference or use system preference
        const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');
        const currentTheme = localStorage.getItem('theme');
        
        if (currentTheme === 'dark' || (!currentTheme && prefersDarkScheme.matches)) {
            document.body.setAttribute('data-theme', 'dark');
            icon.classList.replace('fa-moon', 'fa-sun');
        }
        
        themeToggle.addEventListener('click', () => {
            let theme;
            
            if (document.body.getAttribute('data-theme') === 'dark') {
                document.body.removeAttribute('data-theme');
                icon.classList.replace('fa-sun', 'fa-moon');
                theme = 'light';
            } else {
                document.body.setAttribute('data-theme', 'dark');
                icon.classList.replace('fa-moon', 'fa-sun');
                theme = 'dark';
            }
            
            localStorage.setItem('theme', theme);
        });
        
        // Dynamic Foundry button functionality
        const foundryButton = document.getElementById('foundryButton');
        const buttonText = document.getElementById('buttonText');
        const statusIndicator = document.querySelector('.status-indicator');
        const statusDiv = document.getElementById('status');
        const foundryUrl = 'https://rpg.nygard.dev';
        const webhookUrl = 'https://c894bd89-fc85-40ea-870b-6cee477a8b5d.webhook.noe.azure-automation.net/webhooks?token=JoA%2bVD0IcKpDpvfK3Z0FVLsA8pS4oJLHAXFin8R%2fiV0%3d';
        
        // Function to check if Foundry server is online
        async function checkFoundryStatus() {
            statusIndicator.className = 'status-indicator status-checking';
            buttonText.textContent = 'Checking status...';
            
            try {
                // Use fetch with a timeout to check if the server is responsive
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000); // 5 second timeout
                
                const response = await fetch(foundryUrl, {
                    method: 'HEAD', // Just check headers, don't need body
                    mode: 'no-cors', // Important for cross-origin requests
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                // If we get here, the server responded (although with no-cors we can't check status)
                // We'll consider this as the server being online
                setFoundryOnline();
            } catch (error) {
                // If fetch throws an error or times out, the server is likely offline
                setFoundryOffline();
            }
        }
        
        // Set button to "online" state
        function setFoundryOnline() {
            statusIndicator.className = 'status-indicator status-online';
            buttonText.textContent = 'Go to Foundry RPG';
            foundryButton.onclick = () => {
                window.open(foundryUrl, '_blank');
            };
            statusDiv.textContent = 'Foundry server is online';
            statusDiv.className = 'status success';
            foundryButton.classList.remove('loading');
            foundryButton.disabled = false;
        }
        
        // Set button to "offline" state
        function setFoundryOffline() {
            statusIndicator.className = 'status-indicator status-offline';
            buttonText.textContent = 'Start Foundry Server';
            foundryButton.onclick = startFoundryServer;
            statusDiv.textContent = 'Foundry server is offline';
            statusDiv.className = 'status';
            foundryButton.classList.remove('loading');
            foundryButton.disabled = false;
        }
        
        // Function to start the Foundry server via webhook
        function startFoundryServer() {
            foundryButton.classList.add('loading');
            foundryButton.disabled = true;
            statusDiv.textContent = 'Starting server...';
            statusDiv.className = 'status';
            
            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: 'Webhook triggered' }),
                mode: 'no-cors'
            })
            .then(() => {
                console.log('Request sent.');
                statusDiv.textContent = 'Server starting! It will be ready in a few minutes.';
                statusDiv.classList.add('success');
                
                // After triggering the webhook, start periodic checks to detect when the server comes online
                startPollingForServerStart();
            })
            .catch((error) => {
                console.error('Error:', error);
                statusDiv.textContent = 'Error starting server. Please try again.';
                statusDiv.classList.add('error');
                foundryButton.classList.remove('loading');
                foundryButton.disabled = false;
            });
        }
        
        // After starting the server, periodically check if it's up yet
        function startPollingForServerStart() {
            statusIndicator.className = 'status-indicator status-checking';
            buttonText.textContent = 'Server starting...';
            
            // Check every 30 seconds
            const pollingInterval = setInterval(() => {
                fetch(foundryUrl, {
                    method: 'HEAD',
                    mode: 'no-cors',
                    timeout: 5000
                })
                .then(() => {
                    // Server is up!
                    clearInterval(pollingInterval);
                    setFoundryOnline();
                })
                .catch(() => {
                    // Server still starting, continue polling
                    console.log('Server still starting...');
                });
            }, 30000); // Check every 30 seconds
            
            // Stop polling after 10 minutes (20 checks at 30-second intervals) if server hasn't started
            setTimeout(() => {
                clearInterval(pollingInterval);
                if (statusIndicator.className.includes('checking')) {
                    statusDiv.textContent = 'Server might be taking longer than expected. Try refreshing.';
                    setFoundryOffline();
                }
            }, 600000); // 10 minutes
            
            // Reset button after some time, but keep "Starting..." text
            setTimeout(() => {
                foundryButton.classList.remove('loading');
                foundryButton.disabled = false;
            }, 3000);
        }
        
        // Check status periodically (every 5 minutes)
        function startPeriodicChecks() {
            checkFoundryStatus(); // Initial check
            
            // Recheck every 5 minutes
            setInterval(checkFoundryStatus, 300000);
        }
        
        // Start checking when page loads
        window.addEventListener('load', startPeriodicChecks);
    </script>
</body>
</html>
