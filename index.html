    <style>
        :root {
            color-scheme: light;
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --text: #2b2d42;
            --light-text: #555;
            --background: #f8f9fa;
            --card-bg: #ffffff;
            --success: #38b000;
            --error: #e63946;
            --warning: #ffb703;
            --border-radius: 12px;
            --transition: all 0.3s ease;
            --shadow: 0 8px 30px rgba(0,0,0,0.05);
            --shadow-hover: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        :root[data-theme="dark"] {
            color-scheme: dark;
            --primary: #4cc9f0;
            --primary-dark: #4361ee;
            --secondary: #f72585;
            --text: #f8f9fa;
            --light-text: #d9d9d9;
            --background: #121212;
            --card-bg: #1e1e1e;
            --success: #52b788;
            --shadow: 0 8px 30px rgba(0,0,0,0.2);
            --shadow-hover: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--background);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen-Sans, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
            color: var(--text);
            transition: background-color 0.3s ease, color 0.3s ease;
            line-height: 1.6;
            padding: 20px;
        }
        
        .icon {
            display: inline-block;
            width: 1em;
            height: 1em;
            stroke-width: 0;
            stroke: currentColor;
            fill: currentColor;
            font-size: 1.1rem;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            transition: var(--transition);
            animation: fadeIn 0.5s ease-out;
        }
        
        .logo-container {margin-bottom: 20px;}
        
        h1 {
            color: var(--text);
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }
        
        .tag-line {
            font-weight: 400;
            color: var(--light-text);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .underline {
            display: block;
            height: 4px;
            width: 80px;
            margin: 10px auto 25px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
        }
        
        p {
            color: var(--light-text);
            font-size: 1rem;
            margin-bottom: 5px;
            font-weight: 400;
        }
        
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        
        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 700;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            border: none;
            width: 100%;
        }
        
        .button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
            
        }
        
        .button:active {transform: translateY(0);}

        .button:focus-visible,
        .theme-switch:focus-visible {
            outline: 3px solid var(--secondary);
            outline-offset: 3px;
        }
        
        .theme-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .theme-switch:hover {transform: rotate(30deg);}
        
        .status {
            margin-top: 20px;
            font-size: 0.9rem;
            height: 20px;
            transition: var(--transition);
        }
        
        .success {color: var(--success);}
        .error {color: var(--error);}
        
        .footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--light-text);
        }

        .footer > span {margin-right: 8px;}

        .icon-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            color: var(--light-text);
            background-color: transparent;
            text-decoration: none;
            opacity: 0.7;
            transition: var(--transition);
        }

        .icon-link .icon {font-size: 1rem;}

        .icon-link:hover {
            color: white;
            background-color: var(--primary);
            opacity: 1;
        }

        .icon-link:focus-visible {
            outline: 3px solid var(--secondary);
            outline-offset: 2px;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        
        .button.loading .spinner {display: inline-block;}
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-online {
            background-color: var(--success);
            box-shadow: 0 0 5px var(--success);
        }
        
        .status-offline {
            background-color: var(--error);
            box-shadow: 0 0 5px var(--error);
        }

        .status-checking {
            background-color: var(--warning);
            box-shadow: 0 0 5px var(--warning);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes spin {to {transform: rotate(360deg);}}
        
        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }
        
        @keyframes pulse {
            0% {opacity: 0.6;}
            50% {opacity: 1;}
            100% {opacity: 0.6;}
        }
        
        @media (max-width: 600px) {
            .container {padding: 30px 20px;}
            h1 {font-size: 2rem;}
        }

        @media (prefers-reduced-motion: reduce) {
            *, .container, .spinner, .status-checking {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
