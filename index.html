<!DOCTYPE html>
<html>

<head>
    <!--Security Headers
    X-Frame-Options "SAMEORIGIN" always;

    <title>NygDev</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .container {

        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            font-size: 1em;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;

<body>
    <div class="container">
        <h1>NygDev</h1>
        <div class="underline"></div>

        <a href="https://rpg.nygard.dev" class="button">Foundry RPG</a>
        <br>
        <a href="https://www.linkedin.com/in/theodor-nyg%C3%A5rd-17218a79/" class="button">LinkedIn</a>
        <br>
        <button class="button" onclick="postWebhook()">Trigger Webhook</button>
    </div>

    <script>
        function postWebhook() {
            fetch('https://c894bd89-fc85-40ea-870b-6cee477a8b5d.webhook.noe.azure-automation.net/webhooks?token=JoA%2bVD0IcKpDpvfK3Z0FVLsA8pS4oJLHAXFin8R%2fiV0%3d', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: 'Webhook triggered' }),
                mode: 'no-cors'
            })
                .then(() => {
                    console.log('Request sent.');
                    alert('Webhook triggered successfully!');
                })
                .catch((error) => {
                    console.error('Error:', error);
                    alert('Error triggering webhook.');
                });
        }
    </script>
</body>

</html>
