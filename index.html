<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src https: data: 'unsafe-inline' 'unsafe-eval'">
    <meta http-equiv="Permissions-Policy" content="geolocation=()">
    <title>NygDev</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Using system fonts instead of external fonts -->
    
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --text: #2b2d42;
            --light-text: #555;
            --background: #f8f9fa;
            --card-bg: #ffffff;
            --success: #38b000;
            --border-radius: 12px;
            --transition: all 0.3s ease;
            --shadow: 0 8px 30px rgba(0,0,0,0.05);
            --shadow-hover: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        [data-theme="dark"] {
            --primary: #4cc9f0;
            --primary-dark: #4361ee;
            --secondary: #f72585;
            --text: #f8f9fa;
            --light-text: #d9d9d9;
            --background: #121212;
            --card-bg: #1e1e1e;
            --success: #52b788;
            --shadow: 0 8px 30px rgba(0,0,0,0.2);
            --shadow-hover: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--background);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen-Sans, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
            color: var(--text);
            transition: var(--transition);
            line-height: 1.6;
            padding: 20px;
        }
        
        .icon {
            display: inline-block;
            width: 1em;
            height: 1em;
            stroke-width: 0;
            stroke: currentColor;
            fill: currentColor;
            font-size: 1.1rem;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            transition: var(--transition);
            animation: fadeIn 0.5s ease-out;
        }
        
        .logo-container {margin-bottom: 20px;}
        
        h1 {
            color: var(--text);
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }
        
        .tag-line {
            font-weight: 400;
            color: var(--light-text);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .underline {
            display: block;
            height: 4px;
            width: 80px;
            margin: 10px auto 25px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
        }
        
        p {
            color: var(--light-text);
            font-size: 1rem;
            margin-bottom: 5px;
            font-weight: 400;
        }
        
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        
        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 700;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            border: none;
            width: 100%;
        }
        
        .button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        
        .button:active {transform: translateY(0);}
        
        .theme-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .theme-switch:hover {transform: rotate(30deg);}
        
        .status {
            margin-top: 20px;
            font-size: 0.9rem;
            height: 20px;
            transition: var(--transition);
        }
        
        .success {color: var(--success);}
        .error {color: #e63946;}
        
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--light-text);
        }
        
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        
        .button.loading .spinner {display: inline-block;}
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-online {
            background-color: var(--success);
            box-shadow: 0 0 5px var(--success);
        }
        
        .status-offline {
            background-color: #e63946;
            box-shadow: 0 0 5px #e63946;
        }
        
        .status-checking {
            background-color: #ffb703;
            box-shadow: 0 0 5px #ffb703;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes spin {to {transform: rotate(360deg);}}
        
        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }
        
        @keyframes pulse {
            0% {opacity: 0.6;}
            50% {opacity: 1;}
            100% {opacity: 0.6;}
        }
        
        @media (max-width: 600px) {
            .container {padding: 30px 20px;}
            h1 {font-size: 2rem;}
        }
    </style>
</head>
<body>

    <button class="theme-switch" id="themeToggle" aria-label="Toggle dark mode">
        <svg class="icon"><use href="#moon-icon"></use></svg>
    </button>
    
    <div class="container">
        <div class="logo-container">
            <h1>NygDev</h1>
            <div class="underline"></div>
        </div>
        
        <div class="links">
            <a href="https://www.linkedin.com/in/theodor-nyg%C3%A5rd-17218a79/" class="button" target="_blank" rel="noopener noreferrer">
                <svg class="icon"><use href="#linkedin-icon"></use></svg>
                LinkedIn
            </a>
            
            <button class="button" id="foundryButton">
                <div class="spinner"></div>
                <span class="status-indicator"></span>
                <svg class="icon"><use href="#dice-d20-icon"></use></svg>
                <span id="buttonText">Checking Foundry Status...</span>
            </button>
        </div>
        
        <div id="status" class="status"></div>
        
        <div class="footer">
            <span id="year"></span> Theodor
        </div>
    </div>
    
    <script>
        // Constants
        const FOUNDRY_URL = 'https://rpg.nygard.dev';
        const WEBHOOK_URL = 'https://prod-19.norwayeast.logic.azure.com:443/workflows/22fe1114d4e84963912784519f33e676/triggers/POST/paths/invoke?api-version=2016-10-01&sp=%2Ftriggers%2FPOST%2Frun&sv=1.0&sig=8LHefy-KqDqf-rEYoNhagAdIMd4Ui0UBKgOwZWbTmN0';
        const CHECK_TIMEOUT = 5000;       // 5 seconds for status check
        const POLLING_INTERVAL = 15000;   // 15 seconds between server startup checks
        const PERIODIC_CHECK = 300000;    // 5 minutes for regular status checks
        const MAX_STARTUP_WAIT = 600000;  // 10 minutes maximum wait time
        
        // DOM elements
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = themeToggle.querySelector('use');
        const foundryButton = document.getElementById('foundryButton');
        const buttonText = document.getElementById('buttonText');
        const statusIndicator = document.querySelector('.status-indicator');
        const statusDiv = document.getElementById('status');
        
        // Set current year
        document.getElementById('year').textContent = new Date().getFullYear();
        
        // Fetch with timeout
        async function fetchWithTimeout(url, options = {}, timeout = CHECK_TIMEOUT) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeout);
            
            try {
                const response = await fetch(url, {
                    ...options,
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                return response;
            } catch (error) {
                clearTimeout(timeoutId);
                throw error;
            }
        }
        
        // Theme switcher
        function initTheme() {
            const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');
            const currentTheme = localStorage.getItem('theme');
            
            if (currentTheme === 'dark' || (!currentTheme && prefersDarkScheme.matches)) {
                document.body.setAttribute('data-theme', 'dark');
                themeIcon.setAttribute('href', '#sun-icon');
            }
        }
        
        themeToggle.addEventListener('click', () => {
            let theme;
            
            if (document.body.getAttribute('data-theme') === 'dark') {
                document.body.removeAttribute('data-theme');
                themeIcon.setAttribute('href', '#moon-icon');
                theme = 'light';
            } else {
                document.body.setAttribute('data-theme', 'dark');
                themeIcon.setAttribute('href', '#sun-icon');
                theme = 'dark';
            }
            
            localStorage.setItem('theme', theme);
        }, {passive: true});
        
        // Check if Foundry server is online
        async function checkFoundryStatus() {
            statusIndicator.className = 'status-indicator status-checking';
            buttonText.textContent = 'Checking status...';
            
            try {
                await fetchWithTimeout(FOUNDRY_URL, {
                    method: 'HEAD',
                    mode: 'no-cors'
                });
                
                // Server is online
                setFoundryOnline();
            } catch (error) {
                // Server is offline
                setFoundryOffline();
            }
        }
        
        // Set button to "online" state
        function setFoundryOnline() {
            statusIndicator.className = 'status-indicator status-online';
            buttonText.textContent = 'Go to Foundry RPG';
            foundryButton.onclick = () => window.open(FOUNDRY_URL, '_blank');
            statusDiv.textContent = 'Foundry server is online';
            statusDiv.className = 'status success';
            foundryButton.classList.remove('loading');
            foundryButton.disabled = false;
        }
        
        // Set button to "offline" state
        function setFoundryOffline() {
            statusIndicator.className = 'status-indicator status-offline';
            buttonText.textContent = 'Start Foundry Server';
            foundryButton.onclick = startFoundryServer;
            statusDiv.textContent = 'Foundry server is offline';
            statusDiv.className = 'status';
            foundryButton.classList.remove('loading');
            foundryButton.disabled = false;
        }
        
        // Start the Foundry server via webhook
        function startFoundryServer() {
            foundryButton.classList.add('loading');
            foundryButton.disabled = true;
            statusDiv.textContent = 'Starting server...';
            statusDiv.className = 'status';
            
            fetchWithTimeout(WEBHOOK_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: 'Webhook triggered' }),
                mode: 'no-cors'
            })
            .then(() => {
                statusDiv.textContent = 'Server starting! It will be ready in a few minutes.';
                statusDiv.classList.add('success');
                startPollingForServerStart();
            })
            .catch(() => {
                statusDiv.textContent = 'Error starting server. Please try again.';
                statusDiv.classList.add('error');
                foundryButton.classList.remove('loading');
                foundryButton.disabled = false;
            });
        }
        
        // Poll to check if server is up
        function startPollingForServerStart() {
            statusIndicator.className = 'status-indicator status-checking';
            buttonText.textContent = 'Server starting...';
            
            let pollingCount = 0;
            const maxPolls = Math.ceil(MAX_STARTUP_WAIT / POLLING_INTERVAL);
            
            // Remove loading spinner but keep button disabled for better UX
            setTimeout(() => {
                foundryButton.classList.remove('loading');
                foundryButton.disabled = false;
            }, 3000);
            
            // Check every 30 seconds
            const pollingInterval = setInterval(() => {
                pollingCount++;
                
                fetchWithTimeout(FOUNDRY_URL, {
                    method: 'HEAD',
                    mode: 'no-cors'
                })
                .then(() => {
                    // Server is up!
                    clearInterval(pollingInterval);
                    setFoundryOnline();
                })
                .catch(() => {
                    // Server still starting
                    if (pollingCount >= maxPolls) {
                        clearInterval(pollingInterval);
                        statusDiv.textContent = 'Server might be taking longer than expected. Try refreshing.';
                        setFoundryOffline();
                    }
                });
            }, POLLING_INTERVAL);
        }
        
        // Initialize
        function init() {
            initTheme();
            checkFoundryStatus();
            setInterval(checkFoundryStatus, PERIODIC_CHECK);
        }
        
        window.addEventListener('load', init, {passive: true});
    </script>
</body>
</html>
