<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Not found</title>
    <meta name="description" content="No such page on gym.nygard.dev.">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="theme-color" content="#f8f9fa">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Keeps Azure's stock 404 off the domain: that one is served from
         Microsoft's edge with an inline script and none of the headers in
         staticwebapp.config.json. Script-free on purpose — the theme follows
         the OS, so `script-src 'self'` has nothing to object to. The styles
         are a same-origin file for the matching reason: it is what lets
         `style-src` stay plain 'self', with no 'unsafe-inline' in the policy. -->
    <link rel="stylesheet" href="/404.css">
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <div class="underline"></div>
        <p>There is nothing at this address.</p>
        <a class="home" href="/">Back to the token inspector</a>
    </div>
</body>
</html>
