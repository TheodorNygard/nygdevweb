<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GymLog token inspector</title>
    <meta name="description" content="Sign in with Entra ID and inspect the resulting tokens.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="theme-color" content="#f8f9fa">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <!-- Vite rewrites this to the hashed, same-origin bundle at build time, so
         `script-src 'self'` covers it as it covered the hand-written main.js.
         MSAL is inside that bundle now rather than vendored next to it: npm is
         the source either way, and bundling it means the CSP does not have to
         admit a third-party origin to the page that handles access tokens. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
