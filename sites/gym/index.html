<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GymLog</title>
    <meta name="description" content="Log a training block, one tap per set.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#d6ff3f">
    <link rel="manifest" href="/manifest.webmanifest">

    <!-- The Graphite direction is dark only, and the browser chrome has to
         agree with it: a white status bar above a near-black screen is the
         one thing that undoes "lowest glare in a dark gym". -->
    <meta name="theme-color" content="#0b0c0e">
    <meta name="color-scheme" content="dark">

    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         numbers, which is what the screens pad themselves by. Without it the
         insets are zero and the header sits under the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <!-- Vite rewrites this to the hashed, same-origin bundle at build time, so
         `script-src 'self'` covers it. MSAL is bundled in rather than loaded
         from a CDN, so the CSP never has to admit a third-party origin to the
         page that handles access tokens. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
