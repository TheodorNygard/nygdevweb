<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GymLog</title>
    <meta name="description" content="Log a training block, one tap per set.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#d6ff3f">
    <link rel="manifest" href="/manifest.webmanifest">

    <!-- Graphite is dark only, and the browser chrome has to agree: a white
         status bar above a near-black screen undoes the whole direction. -->
    <meta name="theme-color" content="#0b0c0e">
    <meta name="color-scheme" content="dark">

    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         numbers; without it the header sits under the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <!-- Vite rewrites this to the hashed, same-origin bundle, so `script-src
         'self'` covers it. MSAL is bundled rather than loaded from a CDN, so the
         CSP never admits a third-party origin to the page that holds tokens. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
