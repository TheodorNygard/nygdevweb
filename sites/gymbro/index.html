<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>gymbro</title>
    <meta name="description" content="Plan a training block on a screen with room for it.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#d6ff3f">

    <!-- Graphite is dark only, and the browser chrome has to agree: a white
         title bar above a near-black screen undoes the whole direction. -->
    <meta name="theme-color" content="#0b1220">
    <meta name="color-scheme" content="dark">

    <!-- Open the connections the app is about to need while the HTML is still
         being parsed, rather than once ~150 kB of script has downloaded and
         run. `crossorigin` is not decoration: every call to these origins is a
         CORS fetch with `credentials: 'omit'`, and browsers keep anonymous
         connections in a pool of their own — a preconnect without it opens a
         socket none of them can use. The CSP does not govern these hints, so
         `connect-src` needs nothing new. -->
    <link rel="preconnect" href="https://func-nygdev-api.azurewebsites.net" crossorigin>
    <link rel="preconnect" href="https://nygdevcdn.blob.core.windows.net" crossorigin>

    <!-- No warm ping here, so the first API call waits on MSAL asking Entra
         for a token. Resolving Entra's name now takes a DNS round trip off
         that. A lookup rather than a preconnect: MSAL reaches Entra both by
         iframe and by fetch, and the two do not share a connection pool. -->
    <link rel="dns-prefetch" href="https://login.microsoftonline.com">

    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <!-- Vite rewrites this to the hashed, same-origin bundle, so `script-src
         'self'` covers it. MSAL is bundled rather than loaded from a CDN, so the
         CSP never admits a third-party origin to the page that holds tokens. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
