<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Run</title>
    <meta name="description" content="Spot read from the NygDev function app.">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="theme-color" content="#f8f9fa">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            color-scheme: light;
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --text: #2b2d42;
            --light-text: #555;
            --background: #f8f9fa;
            --card-bg: #ffffff;
            --code-bg: #f1f3f5;
            --border: #e3e6ea;
            --success: #38b000;
            --error: #e63946;
            --border-radius: 12px;
            --transition: all 0.3s ease;
            --shadow: 0 8px 30px rgba(0,0,0,0.05);
            --shadow-hover: 0 10px 40px rgba(0,0,0,0.1);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --primary: #4cc9f0;
            --primary-dark: #4361ee;
            --secondary: #f72585;
            --text: #f8f9fa;
            --light-text: #d9d9d9;
            --background: #121212;
            --card-bg: #1e1e1e;
            --code-bg: #161616;
            --border: #333;
            --success: #52b788;
            --shadow: 0 8px 30px rgba(0,0,0,0.2);
            --shadow-hover: 0 10px 40px rgba(0,0,0,0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--background);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen-Sans, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
            color: var(--text);
            transition: background-color 0.3s ease, color 0.3s ease;
            line-height: 1.6;
            padding: 20px;
        }

        .icon {
            display: inline-block;
            width: 1em;
            height: 1em;
            stroke-width: 0;
            stroke: currentColor;
            fill: currentColor;
            font-size: 1.1rem;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            transition: var(--transition);
            animation: fadeIn 0.5s ease-out;
        }

        .logo-container {margin-bottom: 20px;}

        h1 {
            color: var(--text);
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .underline {
            display: block;
            height: 4px;
            width: 80px;
            margin: 10px auto 25px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 700;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            border: none;
            width: 100%;
        }

        .button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .button:active {transform: translateY(0);}

        .button:disabled {
            cursor: progress;
            opacity: 0.75;
            transform: none;
            box-shadow: none;
        }

        .button:focus-visible,
        .theme-switch:focus-visible {
            outline: 3px solid var(--secondary);
            outline-offset: 3px;
        }

        .theme-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .theme-switch:hover {transform: rotate(30deg);}

        .status {
            margin-top: 20px;
            font-size: 0.9rem;
            min-height: 20px;
            transition: var(--transition);
        }

        .success {color: var(--success);}
        .error {color: var(--error);}

        /* The payload shape is not fixed yet, so the read is shown verbatim as
           formatted JSON rather than mapped onto named fields. */
        .result {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background-color: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            text-align: left;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            color: var(--text);
            white-space: pre;
            overflow-x: auto;
            max-height: 45vh;
            overflow-y: auto;
            tab-size: 2;
        }

        .result:not(:empty) {display: block;}

        .footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--light-text);
        }

        .footer a {
            color: var(--light-text);
            text-decoration: none;
            opacity: 0.8;
            transition: var(--transition);
        }

        .footer a:hover {
            color: var(--primary);
            opacity: 1;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        .button.loading .spinner {display: inline-block;}
        .button.loading .icon {display: none;}

        @keyframes spin {to {transform: rotate(360deg);}}

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        @media (max-width: 600px) {
            .container {padding: 30px 20px;}
            h1 {font-size: 2rem;}
        }

        @media (prefers-reduced-motion: reduce) {
            *, .container, .spinner {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <svg style="display: none;">
        <symbol id="moon-icon" viewBox="0 0 512 512">
            <path d="M283.211 512c78.962 0 151.079-35.925 198.857-94.792 7.068-8.708-.639-21.43-11.562-19.35-124.203 23.654-238.262-71.576-238.262-196.954 0-72.222 38.662-138.635 101.498-174.394 9.686-5.512 7.25-20.197-3.756-22.23A258.156 258.156 0 0 0 283.211 0c-141.309 0-256 114.511-256 256 0 141.309 114.511 256 256 256z"/>
        </symbol>

        <symbol id="sun-icon" viewBox="0 0 512 512">
            <path d="M256 160c-52.9 0-96 43.1-96 96s43.1 96 96 96 96-43.1 96-96-43.1-96-96-96zm246.4 80.5l-94.7-47.3 33.5-100.4c4.5-13.6-8.4-26.5-21.9-21.9l-100.4 33.5-47.4-94.8c-6.4-12.8-24.6-12.8-31 0l-47.3 94.7L92.7 70.8c-13.6-4.5-26.5 8.4-21.9 21.9l33.5 100.4-94.7 47.4c-12.8 6.4-12.8 24.6 0 31l94.7 47.3-33.5 100.5c-4.5 13.6 8.4 26.5 21.9 21.9l100.4-33.5 47.3 94.7c6.4 12.8 24.6 12.8 31 0l47.3-94.7 100.4 33.5c13.6 4.5 26.5-8.4 21.9-21.9l-33.5-100.4 94.7-47.3c13-6.5 13-24.7.2-31.1zm-155.9 106c-49.9 49.9-131.1 49.9-181 0-49.9-49.9-49.9-131.1 0-181 49.9-49.9 131.1-49.9 181 0 49.9 49.9 49.9 131.1 0 181z"/>
        </symbol>

        <symbol id="bolt-icon" viewBox="0 0 320 512">
            <path d="M296 160H180.6l42.6-129.8C227.2 15 215.7 0 200 0H56C44 0 33.8 8.9 32.2 20.8l-32 240C-1.7 275.2 9.5 288 24 288h118.7L96.6 482.5c-3.6 15.2 8 29.5 23.3 29.5 8.4 0 16.4-4.4 20.8-12l176-304c9.3-15.9-2.2-36-20.7-36z"/>
        </symbol>
    </svg>

    <button class="theme-switch" id="themeToggle" aria-label="Toggle dark mode" aria-pressed="false">
        <svg class="icon"><use href="#moon-icon"></use></svg>
    </button>

    <div class="container">
        <div class="logo-container">
            <h1>Run</h1>
            <div class="underline"></div>
        </div>

        <button class="button" id="spotButton">
            <div class="spinner"></div>
            <svg class="icon"><use href="#bolt-icon"></use></svg>
            <span id="buttonText">Get spot read</span>
        </button>

        <div id="status" class="status" aria-live="polite"></div>

        <pre id="result" class="result" tabindex="0" aria-label="Spot read response"></pre>

        <div class="footer">
            <span><span id="year"></span> Theodor</span>
            <a href="https://nygard.dev">nygard.dev</a>
        </div>
    </div>

    <script src="main.js" defer></script>
</body>
</html>
