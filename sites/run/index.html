<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Marathon prep</title>
    <meta name="description" content="Training dashboard built from the marathon prep feed on blob storage.">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="theme-color" content="#f8f9fa">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        /* Two palettes, and they are not the same thing: the site chrome
           (brand blue/purple, card surfaces) and the chart slots (--series-N,
           --status-N). The slot order is the colour-blind-safety mechanism, so
           do not reorder or extend it without re-validating on both surfaces. */
        :root {
            color-scheme: light;
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --text: #2b2d42;
            --light-text: #555;
            --background: #f8f9fa;
            --card-bg: #ffffff;
            --code-bg: #f1f3f5;
            --border: #e3e6ea;
            --error: #e63946;

            /* Chart ink and chrome */
            --muted: #898781;
            --grid: #e1e0d9;
            --axis: #c3c2b7;

            /* Categorical slots, light steps */
            --series-1: #2a78d6;
            --series-2: #eb6834;
            --series-3: #1baf7a;

            --border-radius: 12px;
            --transition: all 0.3s ease;
            --shadow: 0 8px 30px rgba(0,0,0,0.05);
            --shadow-hover: 0 10px 40px rgba(0,0,0,0.1);
        }

        /* Fixed in both modes and never themed: these mean state, not identity.
           Always shipped with an icon and a word, so the two that sit below
           3:1 on white never carry meaning alone. */
        :root {
            --status-good: #0ca30c;
            --status-warning: #fab219;
            --status-serious: #ec835a;
            --status-critical: #d03b3b;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --primary: #4cc9f0;
                --primary-dark: #4361ee;
                --secondary: #f72585;
                --text: #f8f9fa;
                --light-text: #d9d9d9;
                --background: #121212;
                --card-bg: #1e1e1e;
                --code-bg: #161616;
                --border: #333;
                    --muted: #898781;
                --grid: #2c2c2a;
                --axis: #383835;
                --series-1: #3987e5;
                --series-2: #d95926;
                --series-3: #199e70;
                --shadow: 0 8px 30px rgba(0,0,0,0.2);
                --shadow-hover: 0 10px 40px rgba(0,0,0,0.3);
            }
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --primary: #4cc9f0;
            --primary-dark: #4361ee;
            --secondary: #f72585;
            --text: #f8f9fa;
            --light-text: #d9d9d9;
            --background: #121212;
            --card-bg: #1e1e1e;
            --code-bg: #161616;
            --border: #333;
            --muted: #898781;
            --grid: #2c2c2a;
            --axis: #383835;
            --series-1: #3987e5;
            --series-2: #d95926;
            --series-3: #199e70;
            --shadow: 0 8px 30px rgba(0,0,0,0.2);
            --shadow-hover: 0 10px 40px rgba(0,0,0,0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--background);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen-Sans, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
            color: var(--text);
            transition: background-color 0.3s ease, color 0.3s ease;
            line-height: 1.6;
            padding: 24px 20px 40px;
        }

        .page {
            max-width: 1100px;
            margin: 0 auto;
        }

        .icon {
            display: inline-block;
            width: 1em;
            height: 1em;
            stroke-width: 0;
            stroke: currentColor;
            fill: currentColor;
            font-size: 1.1rem;
            flex: none;
        }

        /* Header */
        .masthead {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .underline {
            display: block;
            height: 4px;
            width: 80px;
            margin: 8px 0 10px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--light-text);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: inherit;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            border: none;
        }

        :root[data-theme="dark"] .button {color: #10202a;}

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .button {color: #10202a;}
        }

        .button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .button:active {transform: translateY(0);}

        .button:disabled {
            cursor: progress;
            opacity: 0.75;
            transform: none;
            box-shadow: none;
        }

        .button:focus-visible,
        .theme-switch:focus-visible,
        .view-toggle:focus-visible,
        .mark:focus-visible {
            outline: 3px solid var(--secondary);
            outline-offset: 3px;
        }

        .theme-switch {
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 6px;
            line-height: 0;
            transition: var(--transition);
        }

        .theme-switch:hover {transform: rotate(30deg);}

        .status {
            font-size: 0.9rem;
            min-height: 24px;
            margin-bottom: 16px;
        }

        .status.error {color: var(--error);}
        .status.success {color: var(--light-text);}

        /* A failed load explains itself in place of the dashboard rather than
           leaving stale numbers under an error line. */
        .load-error {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-left: 4px solid var(--error);
            border-radius: var(--border-radius);
            padding: 20px 24px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .load-error h2 {font-size: 1.1rem; margin-bottom: 8px;}
        .load-error p {font-size: 0.9rem; color: var(--light-text); margin-bottom: 8px;}
        .load-error code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
            font-size: 0.85em;
            background-color: var(--code-bg);
            padding: 2px 6px;
            border-radius: 4px;
            overflow-wrap: anywhere;
        }

        /* A refetch dims the previous render: no skeleton, no layout jump. */
        .dashboard {
            display: none;
            transition: opacity 0.2s ease;
        }

        .dashboard.loaded {display: block;}
        .dashboard.stale {opacity: 0.45;}

        /* Stat tiles */
        .kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }

        .tile {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            padding: 16px 18px;
            box-shadow: var(--shadow);
        }

        .tile-label {
            font-size: 0.78rem;
            color: var(--light-text);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 600;
            line-height: 1.3;
        }

        .tile-value {
            font-size: 1.75rem;
            font-weight: 600;
            line-height: 1.25;
            margin-top: 6px;
        }

        .tile-value .unit {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--light-text);
            margin-left: 3px;
        }

        .tile-note {
            font-size: 0.8rem;
            color: var(--light-text);
            margin-top: 2px;
        }

        /* Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            align-items: start;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            padding: 20px 22px 22px;
            box-shadow: var(--shadow);
            min-width: 0;
        }

        .card.wide {grid-column: 1 / -1;}

        .card-head {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px 16px;
            margin-bottom: 4px;
        }

        .card h2 {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .card-sub {
            font-size: 0.85rem;
            color: var(--light-text);
            margin-bottom: 14px;
        }

        .view-toggle {
            background: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--light-text);
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 4px 10px;
            cursor: pointer;
            transition: var(--transition);
        }

        .view-toggle:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        /* Hero figure — exactly one on the page. */
        .hero {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 8px 18px;
            margin-bottom: 6px;
        }

        .hero-value {
            font-size: 3.5rem;
            font-weight: 600;
            line-height: 1.05;
            letter-spacing: -1.5px;
        }

        .hero-unit {
            font-size: 0.9rem;
            color: var(--light-text);
        }

        /* Status chip: colour plus an icon plus a word, never colour alone. */
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 999px;
            border: 1px solid currentColor;
            line-height: 1.4;
        }

        .chip .icon {font-size: 0.95rem;}
        .chip.good {color: #006300;}
        .chip.warning {color: #7a5200;}
        .chip.serious {color: #9c4110;}
        .chip.critical {color: #a32424;}

        :root[data-theme="dark"] .chip.good {color: var(--status-good);}
        :root[data-theme="dark"] .chip.warning {color: var(--status-warning);}
        :root[data-theme="dark"] .chip.serious {color: var(--status-serious);}
        :root[data-theme="dark"] .chip.critical {color: var(--status-critical);}

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .chip.good {color: var(--status-good);}
            :root:not([data-theme="light"]) .chip.warning {color: var(--status-warning);}
            :root:not([data-theme="light"]) .chip.serious {color: var(--status-serious);}
            :root:not([data-theme="light"]) .chip.critical {color: var(--status-critical);}
        }

        .reading {
            font-size: 0.88rem;
            color: var(--light-text);
            margin-top: 12px;
        }

        /* Legend — always present for two or more series. */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 18px;
            margin-bottom: 10px;
            font-size: 0.82rem;
            color: var(--light-text);
        }

        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .legend-key {
            display: inline-block;
            flex: none;
            border-radius: 2px;
        }

        .legend-key.rect {width: 12px; height: 12px;}
        .legend-key.line {width: 16px; height: 3px; border-radius: 2px;}

        /* Drawn at the measured pixel width, so normally no scaling happens at
           all. max-width with height:auto only matters when a measurement is
           stale: the drawing then scales down whole rather than being
           letterboxed in a fixed-height box. */
        .chart {
            display: block;
            max-width: 100%;
            height: auto;
            overflow: visible;
        }

        .chart text {
            font-family: inherit;
            fill: var(--muted);
            font-size: 11px;
            font-variant-numeric: tabular-nums;
        }

        .chart text.value-label {
            fill: var(--text);
            font-size: 11px;
            font-weight: 700;
        }

        .chart text.panel-title {
            fill: var(--text);
            font-size: 12px;
            font-weight: 700;
            font-variant-numeric: normal;
        }

        .chart .gridline {stroke: var(--grid); stroke-width: 1;}
        .chart .axisline {stroke: var(--axis); stroke-width: 1;}
        .mark {cursor: default;}
        .mark:focus {outline: none;}

        .panels {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .panel {min-width: 0;}

        /* The shape of the card survives; the numbers are just not there yet.
           Sparse data is normal early in a block. */
        .empty {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 22px 18px;
            border: 1px dashed var(--border);
            border-radius: var(--border-radius);
            color: var(--light-text);
            font-size: 0.88rem;
        }

        /* Table view — the WCAG-clean twin of every chart. */
        .table-wrap {
            display: none;
            overflow-x: auto;
            margin-top: 4px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 0.85rem;
        }

        caption {
            text-align: left;
            color: var(--light-text);
            font-size: 0.82rem;
            padding-bottom: 8px;
        }

        th, td {
            text-align: right;
            padding: 7px 10px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        th:first-child, td:first-child {
            text-align: left;
            font-variant-numeric: normal;
        }

        thead th {
            color: var(--light-text);
            font-weight: 600;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        tbody tr:last-child td,
        tbody tr:last-child th {border-bottom: none;}

        /* Enhances, never gates: every value it shows is also in the table. */
        .tooltip {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.12s ease;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow-hover);
            padding: 9px 12px;
            font-size: 0.82rem;
            line-height: 1.45;
            max-width: 260px;
        }

        .tooltip.visible {opacity: 1;}
        .tooltip-title {font-weight: 700; margin-bottom: 4px;}

        .tooltip-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .tooltip-key {
            display: inline-block;
            width: 14px;
            height: 3px;
            border-radius: 2px;
            flex: none;
            transform: translateY(-3px);
        }

        /* Values lead, labels follow. */
        .tooltip-value {font-weight: 700; font-variant-numeric: tabular-nums;}
        .tooltip-name {color: var(--light-text);}

        .footer {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px 16px;
            margin-top: 32px;
            font-size: 0.8rem;
            color: var(--light-text);
        }

        .footer a {
            color: var(--light-text);
            text-decoration: none;
            opacity: 0.8;
            transition: var(--transition);
            overflow-wrap: anywhere;
        }

        .footer a:hover {
            color: var(--primary);
            opacity: 1;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,.35);
            border-radius: 50%;
            border-top-color: currentColor;
            animation: spin 1s ease-in-out infinite;
        }

        .button.loading .spinner {display: inline-block;}
        .button.loading .icon {display: none;}

        @keyframes spin {to {transform: rotate(360deg);}}

        @media (max-width: 600px) {
            body {padding: 20px 14px 32px;}
            .card {padding: 18px 16px;}
            h1 {font-size: 1.9rem;}
            .hero-value {font-size: 2.75rem;}
            .masthead {align-items: flex-start;}
        }

        @media (prefers-reduced-motion: reduce) {
            *, .spinner {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

    <div class="page">
        <header class="masthead">
            <div>
                <h1>Marathon prep</h1>
                <span class="underline"></span>
                <p class="subtitle" id="asOf">Loading the training feed…</p>
            </div>

            <div class="controls">
                <button class="button" id="refreshButton">
                    <span class="spinner"></span>
                    <svg class="icon" aria-hidden="true"><use href="#refresh-icon"></use></svg>
                    <span id="refreshText">Refresh</span>
                </button>

                <button class="theme-switch" id="themeToggle" aria-label="Toggle dark mode" aria-pressed="false">
                    <svg class="icon" aria-hidden="true"><use href="#moon-icon"></use></svg>
                </button>
            </div>
        </header>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <section class="load-error" id="loadError">
            <h2 id="loadErrorTitle">Could not load the training feed</h2>
            <p id="loadErrorDetail"></p>
            <p>Feed: <code id="loadErrorUrl"></code></p>
        </section>

        <main class="dashboard" id="dashboard">
            <section class="kpis" id="kpis" aria-label="Key figures"></section>

            <div class="grid" id="cards"></div>
        </main>

        <footer class="footer">
            <span><span id="year"></span> Theodor</span>
            <a href="https://nygard.dev">nygard.dev</a>
            <a id="feedLink" href="#">Raw feed</a>
        </footer>
