<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Not found</title>
    <meta name="description" content="No such page on run.nygard.dev.">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="theme-color" content="#f8f9fa">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Keeps Azure's stock 404 off the domain: that one is served from
         Microsoft's edge with an inline script and none of the headers in
         staticwebapp.config.json. Script-free on purpose — the theme follows
         the OS, so `script-src 'self'` has nothing to object to. -->
    <style>
        :root {
            color-scheme: light;
            --primary: #4361ee;
            --secondary: #7209b7;
            --text: #2b2d42;
            --light-text: #555;
            --background: #f8f9fa;
            --card-bg: #ffffff;
            --border-radius: 12px;
            --transition: all 0.3s ease;
            --shadow: 0 8px 30px rgba(0,0,0,0.05);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --primary: #4cc9f0;
                --secondary: #f72585;
                --text: #f8f9fa;
                --light-text: #d9d9d9;
                --background: #121212;
                --card-bg: #1e1e1e;
                --shadow: 0 8px 30px rgba(0,0,0,0.2);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--background);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen-Sans, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .underline {
            display: block;
            height: 4px;
            width: 80px;
            margin: 10px auto 25px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
        }

        p {color: var(--light-text);}

        .home {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            font-weight: 700;
            color: white;
            background-color: var(--primary);
            text-decoration: none;
            border-radius: var(--border-radius);
            transition: var(--transition);
        }

        .home:hover {transform: translateY(-2px);}

        .home:focus-visible {
            outline: 3px solid var(--secondary);
            outline-offset: 3px;
        }

        @media (max-width: 600px) {
            .container {padding: 30px 20px;}
            h1 {font-size: 2rem;}
        }

        @media (prefers-reduced-motion: reduce) {
            * {transition: none !important;}
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <div class="underline"></div>
        <p>There is nothing at this address.</p>
        <a class="home" href="/">Back to the spot read</a>
    </div>
</body>
</html>
